[tool.poetry]
name = "infra-ai-agent"
version = "0.1.0"
description = "Production-grade RAG + AI Agent for AWS infrastructure provisioning via Terraform"
authors = ["Ram <ram@example.com>"]
readme = "README.md"
packages = [
    { include = "agent" },
    { include = "rag" },
    { include = "retriever" },
    { include = "embeddings" },
    { include = "vector_db", from = "vector-db" },
    { include = "terraform_engine", from = "terraform-engine" },
    { include = "aws" },
    { include = "api" },
    { include = "configs" },
]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.7.0"
pydantic-settings = "^2.2.1"
python-dotenv = "^1.0.1"
loguru = "^0.7.2"
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.29.0" }
typer = { extras = ["all"], version = "^0.12.3" }
httpx = "^0.27.0"
tiktoken = "^0.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.7"
pytest-cov = "^5.0.0"
black = "^24.4.2"
ruff = "^0.4.4"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
