version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: infra-ai-agent:local
    container_name: infra-ai-agent-api
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      - ../terraform-engine/workspaces:/app/terraform-engine/workspaces
      # AWS SSO/credentials for local dev only — never bake into the image.
      - ${HOME}/.aws:/home/agent/.aws:ro
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - infra-ai-net

  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: infra-ai-agent-qdrant
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/readyz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - infra-ai-net

volumes:
  qdrant_data:

networks:
  infra-ai-net:
    driver: bridge
